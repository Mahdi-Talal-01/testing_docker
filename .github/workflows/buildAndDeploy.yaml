name: Push and Run

on:
  push:
    branches:
      - main

jobs:
  Build-Laravel-And-Push-Dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Build Docker image
        run: docker build -f ./backend/Dockerfile-Laravel -t ${{ secrets.DOCKER_USERNAME }}/dockertestlara:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/dockertestlara:latest

  Build-Node-And-Push-Dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Build Docker image
        run: docker build -f ./Node/Dockerfile-Node -t ${{ secrets.DOCKER_USERNAME }}/dockertestnode:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/dockertestnode:latest

  Build-React-And-Push-Dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Build Docker image
        run: docker build -f ./react/Dockerfile-React -t ${{ secrets.DOCKER_USERNAME }}/dockertestreact:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/dockertestreact:latest
        
  Copy-docker-compose-to-EC2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "docker-compose.yaml"
          target: "/home/${{ secrets.EC2_USER }}/"

  Deploy-Laravel-Docker:
    needs: Build-Laravel-And-Push-Dockerhub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo docker-compose down
            sudo docker rmi ${{ secrets.DOCKER_USERNAME }}/dockertestlara:latest
            sudo docker rmi ${{ secrets.DOCKER_USERNAME }}/dockertestnode:latest
            sudo docker rmi ${{ secrets.DOCKER_USERNAME }}/dockertestreact:latest
            sudo docker-compose up -d
